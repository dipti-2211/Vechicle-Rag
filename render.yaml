# ─────────────────────────────────────────────────────────────────────────────
# Auron — Render.com Deployment Configuration
#
# This file defines both the backend API and frontend static site.
# Deploy with: https://render.com/docs/infrastructure-as-code
#
# ⚠️  IMPORTANT: Set these secret environment variables in the Render dashboard:
#     GEMINI_API_KEY              — your Google Gemini API key
#     SUPABASE_URL                — your Supabase project URL
#     SUPABASE_SERVICE_ROLE_KEY   — your Supabase service role key (backend only!)
#     SUPABASE_DB_URL             — your Supabase PostgreSQL direct connection string
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API (Docker) ────────────────────────────────────────────────────
  - type: web
    name: auron-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health

    # ── Persistent Disk (for local ChromaDB cache + temp uploads) ──────────
    # Even with Supabase, keeping a small disk prevents re-downloading the
    # embedding model on every cold start and caches the ChromaDB index.
    disk:
      name: auron-data
      mountPath: /app/data
      sizeGB: 1

    # ── Environment Variables ────────────────────────────────────────────────
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: /app/data/vehicle_intelligence.db
      - key: UPLOAD_DIR
        value: /app/data/uploads
      - key: CHROMA_PERSIST_DIR
        value: /app/data/chroma
      - key: GEMINI_LLM_MODEL
        value: gemini-2.0-flash-lite
      - key: TOP_K_RESULTS
        value: "5"
      - key: CHUNK_SIZE
        value: "800"
      - key: CHUNK_OVERLAP
        value: "200"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      # CORS — allow the deployed frontend (and localhost for local dev)
      - key: ALLOWED_ORIGINS
        value: "https://auron-frontend.onrender.com,http://localhost:5173,http://localhost:3000"
      # Supabase Storage bucket name
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      # !! Set these as SECRETS in the Render dashboard — never commit real values !!
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

  # ── Frontend Static Site ────────────────────────────────────────────────────
  - type: web
    name: auron-frontend
    env: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      # SPA routing — all routes serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Production backend URL — used by Vite at build time
      - key: VITE_API_URL
        value: "https://auron-backend-un4f.onrender.com"
